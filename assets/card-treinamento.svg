<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 150" width="430" height="150" role="img" aria-label="treinamentoSPS — training evaluation app on SAP CAP">
  <defs>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="1.5" y="1.5" width="427" height="147" rx="14" fill="#2B0A1E" stroke="#FFB3D1" stroke-width="1.5">
    <animate attributeName="stroke-opacity" values="1;0.5;1" dur="4s" repeatCount="indefinite"/>
  </rect>
  <text x="26" y="52" font-size="30" font-family="sans-serif">📊</text>
  <text x="72" y="46" font-family="ui-monospace, Consolas, monospace" font-size="19" font-weight="bold" fill="#FFB3D1" filter="url(#glow)">treinamentoSPS</text>
  <text x="26" y="86" font-family="ui-monospace, Consolas, monospace" font-size="13" fill="#FFF0F5" opacity="0.85">training evaluation app — ratings,</text>
  <text x="26" y="104" font-family="ui-monospace, Consolas, monospace" font-size="13" fill="#FFF0F5" opacity="0.85">strengths &amp; improvement points</text>
  <g font-family="ui-monospace, Consolas, monospace" font-size="11">
    <rect x="26" y="118" width="76" height="20" rx="10" fill="none" stroke="#C77DFF" stroke-opacity="0.7"/>
    <text x="64" y="132" text-anchor="middle" fill="#C77DFF">SAP CAP</text>
    <rect x="110" y="118" width="70" height="20" rx="10" fill="none" stroke="#FF4D8D" stroke-opacity="0.7"/>
    <text x="145" y="132" text-anchor="middle" fill="#FF4D8D">Node.js</text>
  </g>
  <text x="398" y="34" font-size="14" fill="#FFB3D1" font-family="sans-serif">✦<animate attributeName="opacity" values="0.3;1;0.3" dur="3s" repeatCount="indefinite"/></text>
</svg>
