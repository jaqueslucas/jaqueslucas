<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="900" height="240" role="img" aria-label="Lucas Jaques de Souza — full-stack developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2B0A1E"/>
      <stop offset="1" stop-color="#3D0F2C"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF4D8D"/>
      <stop offset="0.6" stop-color="#FF7AB8"/>
      <stop offset="1" stop-color="#C77DFF"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="900" height="240" rx="18" fill="url(#bg)"/>

  <!-- faint arcade grid -->
  <g stroke="#FF4D8D" stroke-width="1" opacity="0.07">
    <path d="M0 60 H900 M0 120 H900 M0 180 H900"/>
    <path d="M150 0 V240 M300 0 V240 M450 0 V240 M600 0 V240 M750 0 V240"/>
  </g>

  <!-- sign frame -->
  <rect x="14" y="14" width="872" height="212" rx="14" fill="none" stroke="#FFB3D1" stroke-opacity="0.35" stroke-width="1.5"/>
  <rect x="20" y="20" width="860" height="200" rx="11" fill="none" stroke="#FF4D8D" stroke-opacity="0.5" stroke-width="1" stroke-dasharray="6 8">
    <animate attributeName="stroke-dashoffset" from="0" to="-28" dur="2.5s" repeatCount="indefinite"/>
  </rect>

  <!-- neon name: flickers on like a sign, then breathes -->
  <g filter="url(#glow)">
    <text x="450" y="118" text-anchor="middle" font-family="ui-monospace, 'Cascadia Code', Consolas, 'Courier New', monospace" font-size="50" font-weight="bold" fill="url(#neon)" letter-spacing="1">
      Lucas Jaques de Souza
      <animate attributeName="opacity" values="0;1;0.35;1;0.7;1;1" keyTimes="0;0.15;0.25;0.4;0.55;0.7;1" dur="2.2s" repeatCount="1"/>
      <animate attributeName="opacity" values="1;0.88;1" dur="4s" begin="2.2s" repeatCount="indefinite"/>
    </text>
  </g>

  <text x="450" y="158" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="17" fill="#FFB3D1" letter-spacing="2">&lt;full-stack developer /&gt;</text>
  <text x="450" y="192" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="14" fill="#FFF0F5" opacity="0.75">SAP CAP certified ✦ JavaScript ✦ TypeScript ✦ React ✦ Node.js</text>

  <!-- floating sparkles -->
  <g fill="#FFB3D1" font-size="18" font-family="sans-serif">
    <text x="70" y="70">✦<animate attributeName="opacity" values="0.2;1;0.2" dur="2.6s" repeatCount="indefinite"/></text>
    <text x="828" y="90" font-size="13">✦<animate attributeName="opacity" values="1;0.15;1" dur="3.4s" repeatCount="indefinite"/></text>
    <text x="120" y="190" font-size="12" fill="#C77DFF">✦<animate attributeName="opacity" values="0.3;1;0.3" dur="3s" repeatCount="indefinite"/></text>
    <text x="790" y="180" fill="#6EF3C5" font-size="11">✦<animate attributeName="opacity" values="0.6;0.1;0.6" dur="2.2s" repeatCount="indefinite"/></text>
    <text x="440" y="52" font-size="12" fill="#FF7AB8">✦<animate attributeName="opacity" values="0.2;0.9;0.2" dur="4s" repeatCount="indefinite"/></text>
  </g>

  <!-- pixel hearts -->
  <g fill="#FF4D8D">
    <path d="M52 118 h6 v6 h6 v-6 h6 v6 h-3 v6 h-3 v6 h-6 v-6 h-3 v-6 h-3 z" opacity="0.9">
      <animate attributeName="opacity" values="0.9;0.4;0.9" dur="3.2s" repeatCount="indefinite"/>
    </path>
    <path d="M830 128 h5 v5 h5 v-5 h5 v5 h-2.5 v5 h-2.5 v5 h-5 v-5 h-2.5 v-5 h-2.5 z" fill="#C77DFF" opacity="0.8">
      <animate attributeName="opacity" values="0.4;0.9;0.4" dur="2.8s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>
